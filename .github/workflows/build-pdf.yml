name: Build clean math test PDF
on:
  push:
    branches:
      - chatgpt-pdf-build
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-pdf-build
      - name: Normalize LaTeX source
        run: sed -i 's/,bottomsep=0mm//' test.tex
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: test.tex
          latexmk_use_xelatex: true
          args: -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-math-test-pdf
          path: test.pdf
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test.pdf
          git diff --cached --quiet || git commit -m "Build clean math test PDF [skip ci]"
          git push origin HEAD:chatgpt-pdf-build
