name: Package PDF without compression
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload uncompressed PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: direct-pdf-uncompressed
          path: test.pdf
          compression-level: 0
